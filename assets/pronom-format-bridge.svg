<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">文件、格式识别与后续复用</title>
  <desc id="diagram-desc">三阶段概念示意：首先是原始文件，其次是识别格式，最后是后续复用。仅中间的格式识别环节以琥珀色突出，标注 PRONOM 提供格式信息与识别线索。后续读取、迁移与展示还需要另选工具和策略，并非自动修复流程。</desc>
  <rect width="900" height="360" fill="#12232f"/>
  <path d="M32 301h836M32 47h836" stroke="#455c6455"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <g transform="translate(150 0)">
      <text x="0" y="78" fill="#a8b8ba" font-size="15" letter-spacing="2">01 / FILE</text>
      <path d="M-29 107H8l22 22v47h-59Z M8 107v22h22" fill="none" stroke="#a8b8ba" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-15 146h31m-31 12h22" stroke="#80999e" stroke-width="2"/>
      <text x="0" y="218" fill="#d2d9cd" font-size="28">原始文件</text>
      <text x="0" y="252" fill="#a1b4b4" font-size="17">保存下来的字节</text>
    </g>
    <g transform="translate(450 0)">
      <rect x="-122" y="58" width="244" height="222" fill="#d8af7310" stroke="#d8af7388"/>
      <text x="0" y="85" fill="#e3bc83" font-size="15" letter-spacing="2">02 / IDENTIFY</text>
      <circle cx="-5" cy="135" r="23" fill="none" stroke="#e3bc83" stroke-width="2"/><path d="m12 153 22 22" stroke="#e3bc83" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="216" fill="#f0d2a5" font-size="28">识别格式</text>
      <text x="0" y="249" fill="#e3bc83" font-size="19" letter-spacing="1">PRONOM</text>
    </g>
    <g transform="translate(750 0)">
      <text x="0" y="78" fill="#a8b8ba" font-size="15" letter-spacing="2">03 / REUSE</text>
      <path d="M-35 114H35v49h-70Zm35 49v14m-18 0h36" fill="none" stroke="#a8b8ba" stroke-width="2" stroke-linejoin="round"/>
      <path d="m-15 138 10 9 21-21" stroke="#a8b8ba" stroke-width="2" fill="none"/>
      <text x="0" y="218" fill="#d2d9cd" font-size="28">后续复用</text>
      <text x="0" y="252" fill="#a1b4b4" font-size="17">另选工具与策略</text>
    </g>
    <text x="450" y="331" fill="#b5c0b4" font-size="17">PRONOM 支持中间环节：格式信息与识别线索</text>
  </g>
  <g stroke="#91a6aa" fill="none" stroke-width="1.5"><path d="M234 148h65M601 148h65" stroke-dasharray="4 5"/><path d="m289 141 10 7-10 7m367-14 10 7-10 7"/></g>
</svg>
